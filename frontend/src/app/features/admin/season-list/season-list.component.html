<div class="page">
  <div class="page-header">
    <h1>Temporadas</h1>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nueva temporada
    </button>
  </div>

  @if (loading()) {
    <div class="spinner-row">
      <mat-spinner diameter="32" />
    </div>
  } @else if (seasons().length === 0) {
    <p class="empty-state">Todavía no hay temporadas.</p>
  } @else {
    <table mat-table [dataSource]="seasons()" class="seasons-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let season">{{ season.name }}</td>
      </ng-container>

      <ng-container matColumnDef="range">
        <th mat-header-cell *matHeaderCellDef>Periodo</th>
        <td mat-cell *matCellDef="let season">
          {{ season.startDate | date: 'dd/MM/yyyy' }} - {{ season.endDate | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let season">
          @if (season.isActive) {
            <mat-chip>Activa</mat-chip>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let season">
          <button mat-icon-button (click)="openEdit(season)" aria-label="Editar">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
