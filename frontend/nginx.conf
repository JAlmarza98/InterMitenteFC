# Preserve the original client scheme when we're behind the user's own
# TLS-terminating reverse proxy (the common case on Proxmox): reuse the
# upstream X-Forwarded-Proto if one was already set, otherwise fall back
# to this connection's own scheme (e.g. when accessed directly).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Angular's output-hashing puts a content hash in every built JS/CSS
    # filename, so these can be cached for a year — a new deploy always
    # ships new filenames, never reuses a stale cached one.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker's own update-detection depends on always fetching a
    # fresh ngsw.json/ngsw-worker.js, and index.html must reflect the latest
    # deploy immediately — none of these should ever be cached.
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
