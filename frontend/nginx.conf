# Preserve the original client scheme when we're behind the user's own
# TLS-terminating reverse proxy (the common case on Proxmox): reuse the
# upstream X-Forwarded-Proto if one was already set, otherwise fall back
# to this connection's own scheme (e.g. when accessed directly).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Only ask browsers to force HTTPS when we can actually tell the original
# request was HTTPS — this container itself may be reached over plain HTTP
# by the user's own TLS-terminating reverse proxy.
map $forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 512;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Applied to every response below, including ones from location blocks
    # that don't define their own add_header — nginx only stops inheriting
    # these once a location sets its own, which is why they're repeated in
    # the three blocks further down that set Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';" always;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Angular's output-hashing puts a content hash in every built JS/CSS
    # filename, so these can be cached for a year — a new deploy always
    # ships new filenames, never reuses a stale cached one.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    # The service worker's own update-detection depends on always fetching a
    # fresh ngsw.json/ngsw-worker.js, and index.html must reflect the latest
    # deploy immediately — none of these should ever be cached.
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
